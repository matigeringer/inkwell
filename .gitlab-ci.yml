image: node:22-bookworm-slim

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: "$CI_COMMIT_BRANCH || $CI_COMMIT_TAG"

stages:
  - test
  - package
  - release

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

cache:
  key:
    files:
      - electron-app/package-lock.json
  paths:
    - .cache/npm/

quality:
  stage: test
  script:
    - cd electron-app
    - npm run release:check
    - npm ci --prefer-offline
    - npm run check
    - npm audit --omit=dev --audit-level=low
    - npm audit --audit-level=high

# The builder image includes the Linux and Windows packaging tools.
# Binaries are built for merge requests too; only stable version tags publish.
package:
  stage: package
  image: electronuserland/builder:22-wine
  parallel:
    matrix:
      - TARGET: [linux, win]
  variables:
    ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
    ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"
    CSC_IDENTITY_AUTO_DISCOVERY: "false"
  script:
    - cd electron-app
    - npm ci --prefer-offline
    - npm run build:$TARGET
  artifacts:
    name: "inkwell-$CI_COMMIT_REF_SLUG-$TARGET"
    expire_in: 14 days
    paths:
      - electron-app/dist/*.AppImage
      - electron-app/dist/*.deb
      - electron-app/dist/*-windows-x64.exe
      - electron-app/dist/SHA256SUMS-*.txt

release:
  stage: release
  needs:
    - job: package
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  resource_group: release-$CI_COMMIT_TAG
  script:
    - cd electron-app
    - npm run release:publish
