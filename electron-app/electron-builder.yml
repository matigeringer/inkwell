appId: com.inkwell.app
productName: Inkwell
directories:
  buildResources: resources
  output: dist
# Include compiled code and production dependencies, without source/tests/caches.
files:
  - out/**/*
  - package.json
  - from: resources
    to: resources
    filter:
      - icon.png
      - icon.ico
extraFiles:
  - from: ../LICENSE
    to: LICENSE
asar: true
asarUnpack:
  - resources/**
npmRebuild: false
publish: null
win:
  executableName: inkwell
  icon: resources/icon.ico
  target:
    - target: portable
      arch: [x64]
portable:
  artifactName: ${name}-${version}-windows-${arch}.${ext}
  requestExecutionLevel: user
nsis:
  artifactName: ${name}-${version}-windows-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false
  license: ../LICENSE
  installerLanguages: [es_ES, en_US]
linux:
  executableName: inkwell
  icon: resources/icon.png
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
appImage:
  artifactName: ${name}-${version}-linux-${arch}.${ext}
deb:
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  maintainer: Inkwell contributors (https://gitlab.com/ada-arg/fountain/-/issues)
